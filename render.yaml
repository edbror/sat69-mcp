services:
  - type: web
    name: sat69-mcp
    # Runtime Python nativo: sin OCR ni dependencias de sistema (a diferencia
    # del MCP de movilizaciones, que rasteriza PDF). No hace falta Docker.
    runtime: python
    plan: free            # sube a "starter" para always-on
    region: ohio

    buildCommand: "pip install --upgrade pip && pip install ."
    startCommand: "sat69-web"

    healthCheckPath: /health
    autoDeploy: true

    envVars:
      # ── Auth ──────────────────────────────────────────────────────────────
      - key: MCP_API_KEY
        sync: false          # bearer estático: protege /refresh, /reload y /mcp (si OAuth off)

      # ── OAuth (WorkOS AuthKit) — opcional ─────────────────────────────────
      - key: AUTHKIT_DOMAIN
        sync: false          # e.g. https://tu-proyecto.authkit.app (habilita OAuth 2.1 DCR)
      - key: BASE_URL
        value: "https://sat69-mcp.onrender.com"

      # ── Turso (SQLite durable) ────────────────────────────────────────────
      - key: TURSO_DATABASE_URL
        sync: false          # libsql://tu-db.turso.io
      - key: TURSO_AUTH_TOKEN
        sync: false

      # ── Descarga (proxy opcional — el SAT no bloqueó datacenter en pruebas) ─
      - key: FETCH_PROXY
        sync: false          # http://user:pass@host:port (o usa DATAIMPULSE_*)

      # ── Tuning ────────────────────────────────────────────────────────────
      - key: FETCH_ON_STARTUP
        value: "true"        # importa en el primer boot si la DB está vacía
      - key: DB_PATH
        value: "/tmp/sat69.db"
      - key: LOG_LEVEL
        value: "info"
      - key: PYTHON_VERSION
        value: "3.13.1"
