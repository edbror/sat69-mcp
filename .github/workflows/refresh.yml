name: Refresh SAT 69/69-B

# La ingesta corre en el runner de GitHub (fiable, sin spin-down del free tier),
# descarga los CSV del SAT y hace push directo a Turso. Render sólo hace pull al
# arrancar (FETCH_ON_STARTUP=false). Idempotente por hash (--force para forzar).
#
# El runner arranca con /tmp/sat69.db vacío, así que `python -m sat69.pipeline`
# hace PRIMERO un pull de Turso. Sin ese pull no había estado previo, y sin estado
# previo: (1) los tres guards de `_verificar_frescura` tomaban siempre el camino de
# "primera importación" y no corrían nunca, o sea que el congelamiento de omawww
# habría pasado igual con el guard puesto; y (2) la caché por hash no podía acertar,
# así que cada corrida reescribía 580k filas a Turso aunque el SAT no publicara nada.
#
# Si el pull falla, el paso TRUENA y no se importa nada: importar sobre una base
# vacía y pushear reemplazaría el remoto con una ingesta que ningún guard revisó.
#
# Un guard en rojo deja el job en rojo a propósito. El mensaje del error dice qué
# comparar y, si la baja es real, correr una vez con SAT_PERMITIR_MERMA=1.

# **El horario nominal no choca con el despertador, y eso es casi todo lo que se
# puede prometer.** El cron de Render `mcps-wake-530am` (repo
# wearetherobots/watr-cloud-ops) despierta los MCP a las 11:30 UTC y al arrancar el
# servicio hace su pull de Turso. Este workflow estaba agendado a las 11:30 UTC
# también, o sea que el push (DELETE y luego INSERT por lotes, no atómico) quedaba
# nominalmente encima de la lectura. Se movió a las 10:00 para quitar ese traslape.
#
# **Lo que NO arregla, medido y no supuesto:** el scheduler de GitHub Actions llega
# tarde, y no por minutos. Las últimas diez corridas agendadas para las 11:30
# arrancaron entre las 14:18 y las 18:25 UTC, ninguna cerca de su hora. Con esa
# deriva el horario no garantiza separación de nada, así que la protección real es
# la del #23 y el #24: el pull levanta si se cae, y un índice a medias contesta
# NO_VERIFICADO en vez de LIMPIO.
#
# **Y la consecuencia incómoda de la deriva:** el servicio despierta a las 11:30 y
# hace su único pull ahí, horas ANTES de que esta ingesta corra. O sea que en un día
# normal sirve el corte del ciclo anterior hasta el siguiente despertar. Cerrarlo
# pide que la ingesta avise al servicio (`POST /reload`, que ya existe) y eso
# necesita el secret `MCP_API_KEY` en este repo, que hoy no está. Ver ESTADO.md.
#
# Si alguien mueve una de las dos, tiene que mover la otra.
on:
  schedule:
    - cron: "0 10 * * *"    # 04:00 America/Mexico_City = 10:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Forzar reproceso aunque el hash no cambie"
        type: boolean
        default: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install .
      - name: Ingesta + push a Turso
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          # OJO: NO inyectar SAT_URL_69B_BIS aquí desde un secret. Si el secret no
          # existe, GitHub la pone como env vacía y `os.getenv(.., default)` devuelve
          # "" (no el default), lo que ACTIVA el feature-flag y omite el 69-B Bis.
          # La URL ya está horneada en config.py (es pública). Overridear solo si
          # el SAT mueve la fuente, y en ese caso con un valor NO vacío.
          DB_PATH: /tmp/sat69.db
        run: python -m sat69.pipeline ${{ github.event.inputs.force == 'true' && '--force' || '' }}
