[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sat69-mcp"
version = "1.0.0"
description = "MCP server para consulta de las listas del SAT (Art. 69 y 69-B del CFF) — WATR"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastmcp>=3.0",
    "httpx>=0.27",
    # Servidor web (despliegue en Render)
    "uvicorn[standard]>=0.30",
    "starlette>=0.40",
    # Turso / libSQL (persistencia durable)
    "libsql-client>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.4",
]

[project.scripts]
# stdio transport (Claude Desktop / Cowork / Claude Code)
sat69-mcp = "sat69.server:main"
# Streamable HTTP transport (Render / apps web)
sat69-web = "sat69.web:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sat69"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
